name: Infrastructure CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Validate Terraform & Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Terraform Init & Validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: ./terraform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint ansible

      - name: Create Dummy Vault Password for CI
        run: echo "ci_dummy_password" > .vault_pass
        working-directory: ./ansible

      - name: Check Ansible Playbook Syntax & Lint
        run: |
          ansible-playbook --syntax-check site.yml
          ansible-lint
        working-directory: ./ansible
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: .vault_pass
