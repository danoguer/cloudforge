---
- name: Ensure project deployment directory exists
  ansible.builtin.file:
    path: /opt/cloud1
    state: directory
    mode: '0755'
    owner: ubuntu
    group: ubuntu

- name: Ensure proxy directory structure exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: ubuntu
    group: ubuntu
  loop:
    - /opt/cloud1/proxy
    - /opt/cloud1/proxy/certs

- name: Copy docker-compose.yml to the server
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/cloud1/docker-compose.yml
    mode: '0644'

- name: Copy Nginx configuration file
  ansible.builtin.copy:
    src: nginx.conf
    dest: /opt/cloud1/proxy/nginx.conf
    mode: '0644'

- name: Generate SSL certificate dynamically on target host
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /opt/cloud1/proxy/certs/nginx.key
      -out /opt/cloud1/proxy/certs/nginx.crt
      -subj "/CN=cloud1.local"
      -addext "subjectAltName=DNS:localhost,DNS:cloud1.local,DNS:pma.cloud1.local,IP:{{ ansible_host }}"
    creates: /opt/cloud1/proxy/certs/nginx.crt

- name: Secure SSL private key permissions
  ansible.builtin.file:
    path: /opt/cloud1/proxy/certs/nginx.key
    mode: '0600'
    owner: ubuntu
    group: ubuntu

- name: Renderize dynamic environment file from vault
  ansible.builtin.template:
    src: env.j2
    dest: /opt/cloud1/.env
    mode: '0600'
    owner: ubuntu
    group: ubuntu

- name: Pull Docker images and start the Inception cluster
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/cloud1
  register: docker_output
  changed_when: "'Started' in docker_output.stdout or 'Created' in docker_output.stdout"
