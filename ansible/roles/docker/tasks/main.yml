---
- name: Install dependencies for adding Docker repository
  apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Create directory for Docker apt keyring
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download and add Docker official GPG signing key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add official Docker repository to apt sources
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: yes

- name: Install Docker Engine and execution packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes
