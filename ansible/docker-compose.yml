services:
  db:
    image: mariadb:10.11
    container_name: cdatabase
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

  wordpress:
    image: wordpress:latest
    container_name: cwordpress
    restart: always
    depends_on:
      - db
    volumes:
      - wp_data:/var/www/html
    networks:
      - frontend
      - backend
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}

  phpmyadmin :
    image: phpmyadmin:latest
    container_name: cphp
    restart: always
    depends_on:
      - db
    networks:
      - frontend
      - backend
    environment:
      PMA_HOST: db
      PMA_PORT: 3306

  nginx:
    image: nginx:alpine
    container_name: cnginx
    restart: always
    depends_on:
      - wordpress
      - phpmyadmin
    networks:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  db_data:
    driver: local
  wp_data:
    driver: local
